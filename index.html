<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b22">
<title>Lewis Simulator: Oysterfleet Shift</title>
<style>
  :root { --green: #1d2b22; --gold: #e8c96a; --cream: #f5f0e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--cream); font-family: "Trebuchet MS", Arial, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: fixed; inset: 0; display: none; overflow-y: auto; background: rgba(10, 16, 12, 0.72); z-index: 10; touch-action: pan-y; }
  .screen.show { display: block; }
  .inner { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  .inner.small { max-width: 560px; text-align: center; margin-top: 8vh; background: rgba(20, 28, 22, 0.95); border: 3px solid var(--gold); border-radius: 22px; padding: 28px 22px; }
  h1 { font-family: Georgia, serif; color: var(--gold); font-size: clamp(34px, 7vw, 64px); margin: 8px 0 0; text-shadow: 0 3px 0 #000; }
  h2 { font-family: Georgia, serif; color: var(--gold); margin: 4px 0 12px; }
  h3 { color: var(--gold); margin: 26px 0 10px; border-bottom: 1px solid rgba(232, 201, 106, 0.3); padding-bottom: 6px; }
  .tag { font-size: 18px; max-width: 720px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .stats span { background: rgba(255, 255, 255, 0.08); padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { text-align: left; background: linear-gradient(160deg, #2b3d30, #1a241d); color: var(--cream); border: 2px solid rgba(232, 201, 106, 0.5); border-radius: 16px; padding: 14px; cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 4px; min-height: 120px; }
  .card:hover:not([disabled]) { border-color: var(--gold); transform: translateY(-2px); }
  .card b { font-size: 18px; color: #fff; }
  .card small { opacity: 0.85; line-height: 1.3; }
  .card em { color: #9be59b; font-style: normal; font-size: 13px; margin-top: auto; }
  .card .day { font-weight: bold; color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .card[disabled] { opacity: 0.45; cursor: default; }
  .btn { background: var(--gold); color: var(--green); border: 0; border-radius: 12px; padding: 12px 18px; font: bold 16px inherit; font-family: inherit; cursor: pointer; margin: 6px; }
  .btn.big { display: block; width: 100%; margin: 10px 0; font-size: 20px; padding: 16px; }
  .btn.small { font-size: 13px; padding: 8px 12px; background: #7a1d1d; color: #fff; }
  .foot { opacity: 0.7; font-size: 14px; }
  .opt { display: block; margin: 10px 0; font-size: 16px; }
  .opt input { transform: scale(1.4); margin-right: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { border: 1px solid rgba(232, 201, 106, 0.3); padding: 6px 8px; text-align: left; }
  th { color: var(--gold); }
  .ach { list-style: none; padding: 0; } .ach li { margin: 6px 0; opacity: 0.6; } .ach li.got { opacity: 1; }
  #panel { margin-top: 10px; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hudCanvas { position: absolute; left: 10px; top: 10px; width: min(340px, 46vw); height: auto; }
  #promptCanvas { position: absolute; left: 50%; bottom: 14%; transform: translateX(-50%); width: min(560px, 90vw); height: auto; }
  #toastCanvas { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(560px, 56vw); height: auto; transition: opacity 0.2s; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border: 2px solid rgba(255, 255, 255, 0.85); border-radius: 50%; z-index: 6; pointer-events: none; display: none; }
  #touch { position: fixed; inset: 0; z-index: 7; pointer-events: none; display: none; }
  #stick { position: absolute; left: 22px; bottom: 26px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.35); pointer-events: auto; }
  #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(232, 201, 106, 0.8); }
  #tbtns { position: absolute; right: 12px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 70px); gap: 8px; pointer-events: auto; }
  #tbtns button { width: 70px; height: 58px; border-radius: 14px; border: 2px solid rgba(255, 255, 255, 0.4); background: rgba(20, 28, 22, 0.6); color: #fff; font: bold 13px Arial; line-height: 1.1; }
  #tbtns button small { font-weight: normal; opacity: 0.7; }
  #tbtns button.on { background: rgba(232, 201, 106, 0.85); color: #1d2b22; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1d2b22; color: var(--gold); font: bold 28px Georgia; z-index: 50; }
  @media (max-width: 760px) { #toastCanvas { top: auto; bottom: 30%; width: 92vw; } }
  @media (max-width: 600px) { #tbtns { grid-template-columns: repeat(3, 60px); } #tbtns button { width: 60px; height: 50px; font-size: 11px; } #stick { width: 110px; height: 110px; } #knob { left: 30px; top: 30px; } }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"></div>
<div id="crosshair"></div>
<div id="touch"></div>
<div id="menu" class="screen"></div>
<div id="chooser" class="screen"></div>
<div id="pause" class="screen"></div>
<div id="results" class="screen"></div>
<div id="loading">Opening the Oysterfleet…</div>
<script type="module">
  import('./js/main.js').then(() => document.getElementById('loading').remove()).catch((e) => {
    document.getElementById('loading').textContent = 'Could not load the game: ' + e.message;
    console.error(e);
  });
</script>
</body>
</html>
